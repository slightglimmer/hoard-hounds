# Builds the site and publishes it to GitHub Pages on every push to main.
# In the repo: Settings -> Pages -> Source must be set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set VITE_FORM_ENDPOINT under Settings -> Secrets and variables -> Actions -> Variables
          # (e.g. your Formspree URL). Until it's set, the quote form stays in preview mode.
          VITE_FORM_PROVIDER: endpoint
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
